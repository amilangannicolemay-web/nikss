    .profile-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      text-align: center;
      padding: 30px 20px;
      max-width: 300px;
      transition: transform 0.3s;
    }

    .profile-card:hover {
      transform: translateY(-5px);
    }

    .profile-card img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid #4a90e2;
    }

    .profile-card h2 {
      margin: 10px 0 5px;
      font-size: 22px;
      color: #333;
    }

    .profile-card p {
      font-size: 14px;
      color: #777;
      line-height: 1.4;
    }

    .profile-card button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      background: #4a90e2;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .profile-card button:hover {
      background: #357ab8;
    }

    @media (max-width: 400px) {
      .profile-card {
        padding: 20px 15px;
      }
    }
